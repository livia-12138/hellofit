<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HelloFit">
<meta name="theme-color" content="#B98A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>HelloFit · 减脂记录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="app-header"></header>

  <main id="main">

    <!-- ========== 首页 ========== -->
    <section id="view-dashboard" class="view active"></section>

    <!-- ========== 饮食 ========== -->
    <section id="view-food" class="view"></section>

    <!-- ========== 运动 ========== -->
    <section id="view-exercise" class="view"></section>

    <!-- ========== 体重 ========== -->
    <section id="view-weight" class="view"></section>

    <!-- ========== 支出 ========== -->
    <section id="view-expense" class="view"></section>

    <!-- ========== 设置 ========== -->
    <section id="view-settings" class="view"></section>

  </main>

  <nav id="tabbar">
    <button class="tab active" data-action="nav" data-view="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-action="nav" data-view="food">
      <svg viewBox="0 0 24 24"><path d="M4 3c1.5 2 1.5 6 0 8"/><path d="M20 3c-1.5 2-1.5 6 0 8"/><path d="M6 11h12v2H6z"/><path d="M7 13v7M17 13v7"/></svg>
      <span>饮食</span>
    </button>
    <button class="tab" data-action="nav" data-view="exercise">
      <svg viewBox="0 0 24 24"><path d="M2 12h2l2-2h3l2 4 2-7 2 5h4l2 0"/><path d="M5 17l1-2"/></svg>
      <span>运动</span>
    </button>
    <button class="tab" data-action="nav" data-view="weight">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5v6"/><path d="M12 13.5 8.5 17a2.6 2.6 0 0 1-4.4-2L4.6 12"/><path d="M12 13.5l3.5 3.5a2.6 2.6 0 0 0 4.4-2l-.5-2.5"/></svg>
      <span>体重</span>
    </button>
    <button class="tab" data-action="nav" data-view="expense">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M15.5 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"/></svg>
      <span>支出</span>
    </button>
  </nav>

</div>

<div id="onboarding" class="hidden"></div>
<input id="avatar-file" type="file" accept="image/*" class="hidden">
<div id="modal-backdrop" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
